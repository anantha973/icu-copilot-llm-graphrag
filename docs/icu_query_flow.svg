<svg width="680" height="486" viewBox="0 0 680 486" xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <title>ICU Copilot Clinical Query Flow</title>
  <desc>Flowchart showing query processing through MedGemma entity extraction, multi-source retrieval (PrimeKG, patient state graph, guidelines, telemetry), and Gemma 4 grounded clinical reasoning.</desc>
  <defs>
    <!-- Crisp dark slate markers for maximum line visibility -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#047857"/>
    </marker>
  </defs>

  <!-- Clean White Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- Step 1: Doctor asks a question (Earthy Warm Slate Pastel) -->
  <g id="step1">
    <rect x="220" y="24" width="240" height="52" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.6"/>
    <text x="340" y="45" text-anchor="middle" dominant-baseline="central" fill="#0F172A" font-size="13.5" font-weight="700">Doctor asks a question</text>
    <text x="340" y="62" text-anchor="middle" dominant-baseline="central" fill="#334155" font-size="11.5" font-style="italic" font-weight="500">"Why is patient 4 in red alert?"</text>
  </g>
  <line x1="340" y1="76" x2="340" y2="104" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 2: MedGemma — Clinical Entity Extraction (Earthy Sage / Jade Pastel) -->
  <g id="step2">
    <rect x="180" y="106" width="320" height="54" rx="8" fill="#C6F6D5" stroke="#059669" stroke-width="1.6"/>
    <text x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="#064E3B" font-size="13.5" font-weight="700">MedGemma — Clinical Entity Extraction</text>
    <text x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#065F46" font-size="11.5" font-weight="600">Parses query &amp; extracts condition/drug entities</text>
  </g>

  <!-- Fan-out connectors from MedGemma to 4 Retrieval Boxes -->
  <path d="M 250 160 L 114 206" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 305 160 L 294 206" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 375 160 L 462 206" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 430 160 L 606 206" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Retrieval Box 1: Knowledge Graph (Earthy Sky / Cerulean Pastel) -->
  <g id="retrieval1">
    <rect x="25" y="208" width="176" height="74" rx="8" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.6"/>
    <text x="113" y="230" text-anchor="middle" dominant-baseline="central" fill="#082F49" font-size="13" font-weight="700">Biomedical Graph</text>
    <text x="113" y="248" text-anchor="middle" dominant-baseline="central" fill="#0369A1" font-size="11" font-weight="600">PrimeKG Knowledge Graph</text>
    <text x="113" y="264" text-anchor="middle" dominant-baseline="central" fill="#0369A1" font-size="11" font-weight="600">Drug–disease relations</text>
  </g>

  <!-- Retrieval Box 2: Patient Subgraph (Earthy Warm Amber / Terracotta Pastel) -->
  <g id="retrieval2">
    <rect x="215" y="208" width="158" height="74" rx="8" fill="#FED7AA" stroke="#D97706" stroke-width="1.6"/>
    <text x="294" y="230" text-anchor="middle" dominant-baseline="central" fill="#78350F" font-size="13" font-weight="700">Patient Subgraph</text>
    <text x="294" y="248" text-anchor="middle" dominant-baseline="central" fill="#92400E" font-size="11" font-weight="600">Disease &amp; medication</text>
    <text x="294" y="264" text-anchor="middle" dominant-baseline="central" fill="#92400E" font-size="11" font-weight="600">relationship state</text>
  </g>

  <!-- Retrieval Box 3: Vector RAG (Earthy Soft Cobalt / Steel Blue Pastel) -->
  <g id="retrieval3">
    <rect x="387" y="208" width="150" height="74" rx="8" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.6"/>
    <text x="462" y="230" text-anchor="middle" dominant-baseline="central" fill="#172554" font-size="13" font-weight="700">Vector Guidelines</text>
    <text x="462" y="248" text-anchor="middle" dominant-baseline="central" fill="#1D4ED8" font-size="11" font-weight="600">AHA / ADA Guidelines</text>
    <text x="462" y="264" text-anchor="middle" dominant-baseline="central" fill="#1D4ED8" font-size="11" font-weight="600">FAISS dense retrieval</text>
  </g>

  <!-- Retrieval Box 4: Patient Records / Telemetry (Earthy Warm Stone / Clay Pastel) -->
  <g id="retrieval4">
    <rect x="551" y="208" width="108" height="74" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.6"/>
    <text x="605" y="230" text-anchor="middle" dominant-baseline="central" fill="#0F172A" font-size="13" font-weight="700">Patient Vitals</text>
    <text x="605" y="248" text-anchor="middle" dominant-baseline="central" fill="#334155" font-size="11" font-weight="600">Bed telemetry,</text>
    <text x="605" y="264" text-anchor="middle" dominant-baseline="central" fill="#334155" font-size="11" font-weight="600">labs &amp; acuity</text>
  </g>

  <!-- Fan-in connectors to Gemma 4 Reasoning -->
  <path d="M 113 282 L 250 328" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 294 282 L 310 328" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 462 282 L 390 328" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 605 282 L 430 328" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 3: Gemma 4 — Clinical Reasoning & Explanation (Earthy Lavender / Indigo Pastel) -->
  <g id="step3">
    <rect x="180" y="330" width="320" height="54" rx="8" fill="#DDD6FE" stroke="#818CF8" stroke-width="1.6"/>
    <text x="340" y="352" text-anchor="middle" dominant-baseline="central" fill="#1E1B4B" font-size="13.5" font-weight="700">Gemma 4 — Clinical Reasoning Engine</text>
    <text x="340" y="370" text-anchor="middle" dominant-baseline="central" fill="#3730A3" font-size="11.5" font-weight="600">Synthesizes grounded rationale &amp; bedside actions</text>
  </g>
  <line x1="340" y1="384" x2="340" y2="412" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 4: Answer returned (Rich Mint / Deep Pastel Emerald) -->
  <g id="step4">
    <rect x="200" y="414" width="280" height="48" rx="8" fill="#BBF7D0" stroke="#15803D" stroke-width="2.0"/>
    <text x="340" y="433" text-anchor="middle" dominant-baseline="central" fill="#052E16" font-size="13.5" font-weight="800">Explainable Answer Delivered</text>
    <text x="340" y="450" text-anchor="middle" dominant-baseline="central" fill="#14532D" font-size="11" font-weight="600">Streamed with safety badge to bedside clinician</text>
  </g>
</svg>
